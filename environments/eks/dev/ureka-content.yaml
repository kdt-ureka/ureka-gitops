# EKS dev ureka-content values. environments/base/ureka-content.yaml 위에 겹친다(Argo CD valueFiles: base → eks/dev, argocd/eks/apps).
# EKS dev는 시험용(카나리·NetworkPolicy 시험)이라 작게 둔다: 모든 서비스 1개. 공개하지 않는다(Ingress 없음, 공개는 prod #64).
# 이미지: EC2 dev에서 확인한 것과 같은 tag·digest(흐름: EC2 dev → EKS dev → EKS prod, 각각 gitops PR).
# 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다(scripts/eks/register_root_app.py).
# DB: Service postgres → EC2 dev와 같은 RDS의 dev 논리 DB·계정(environments/eks/dev/data). 비밀값은 #63 ExternalSecret이 같은 이름·키로 만든다.

image:
  requireRegistry: true
  repository: ureka/content
  # content main 4790011: V15(국가 기준정보, ingest 적재 FK 전제)~V18(매핑 버전), 선택형 JVM 지표(#42, 이 환경은 꺼짐).
  tag: sha-47900118a2001a3e1c8126c87c23de7d7a9630dc
  digest: sha256:43d1919c26693137d87c19fa5f4bbb9fe073a4f7eeaa3ad9e750c9c7b2d0a23b
  pullPolicy: IfNotPresent

# JVM: limit 768Mi + base의 -Xmx256m(EC2 dev와 같은 값). EKS에서 kubectl top으로 다시 잰다.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
