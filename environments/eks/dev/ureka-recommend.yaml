# EKS dev ureka-recommend values. environments/base/ureka-recommend.yaml 위에 겹친다(Argo CD valueFiles: base → eks/dev, argocd/eks/apps).
# EKS dev는 시험용(카나리·NetworkPolicy 시험)이라 작게 둔다: 모든 서비스 1개. 공개하지 않는다(Ingress 없음, 공개는 prod #64).
# 이미지: EC2 dev에서 확인한 것과 같은 tag·digest(흐름: EC2 dev → EKS dev → EKS prod, 각각 gitops PR).
# 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다(scripts/eks/register_root_app.py).
# DB: Service postgres → EC2 dev와 같은 RDS의 dev 논리 DB·계정(environments/eks/dev/data). 비밀값은 #63 ExternalSecret이 같은 이름·키로 만든다.

image:
  requireRegistry: true
  repository: ureka/recommend
  tag: sha-16dc2df29cf73594771768f1642f0a799205ef9b
  digest: sha256:0dba4bf88a2bce05f5df39c1e94bca61e4f02f55b54c257b216008134029e0a2
  pullPolicy: IfNotPresent

# EC2 dev와 같은 값. EKS에서 kubectl top으로 다시 잰다.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

# 실제 모드(11/25): content 검색 함수 v2(V19·V20)가 dev content_db에 있어야 한다(content 이미지를 먼저 올린 뒤 이 값을 적용).
# CONTENT_BASE_URL은 Service 포트(80)를 쓴다(:8080이 아님). 키·DB 계정은 base에서 optional 참조이고, 실제 모드에서는 필수로 올린다:
# Secret·키가 없으면 Pod가 시작되지 않아(CreateContainerConfigError) 빈 값으로 readyz 503이 되는 일을 막는다.
# PG_DSN: Service postgres의 dev content_db, 검색 전용 계정(content_db_recommend → content_db_recommend_search 역할로 함수 EXECUTE만).
requiredSecretEnv:
  - DB_USERNAME
  - DB_PASSWORD
  - GEMINI_API_KEY
envOverrides:
  MOCK_MODE: "false"
  SEARCH_ENABLED: "true"
  CONTENT_BASE_URL: http://ureka-content
  MAPPING_FILE: /app/app/mappings/genre-map-v1.json
  PG_DSN: host=postgres port=5432 dbname=content_db user=$(DB_USERNAME) password=$(DB_PASSWORD)
