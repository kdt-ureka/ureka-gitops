# EKS dev 네임스페이스(시험용·작게: 카나리·NetworkPolicy 시험). 공개하지 않는다.
# Pod Security Admission restricted를 강제한다(EC2 dev와 같은 라벨).
# 비root·권한 상승 금지·capability 제거·seccomp를 지키지 않는 Pod(hostNetwork·privileged·hostPath 포함)는 생성 자체가 거부된다.
# EKS 노드는 IMDS hop limit 1이지만 hostNetwork Pod는 IMDS에 닿을 수 있어, 이 라벨이 그 경로를 막는다(docs/eks.md).
# NetworkPolicy(기본 거부 포함)는 #49 범위라 여기 두지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  annotations:
    # Application에서 이 파일이 빠져도 네임스페이스(안의 앱 전부)를 지우지 않는다.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: ureka
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
