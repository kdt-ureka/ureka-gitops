# EKS prod 상한(공개). t3.large 2대 기준 계산은 docs/eks-namespaces.md.
# 서비스 7개(auth 2개) 평상시 요청 790m·약 2.4Gi, 카나리 + chat 마이그레이션 최대 960m·약 3.0Gi.
# 여유분으로 frontend 2개 또는 ingest 1회 정도를 더 띄울 수 있다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: prod
spec:
  hard:
    requests.cpu: 1500m
    requests.memory: 4608Mi
    limits.cpu: "9"
    limits.memory: 7Gi
    pods: "16"
    # 외부 공개는 #64 ALB Ingress(target-type ip)로만 한다. LB·NodePort Service는 만들 수 없다.
    services.loadbalancers: "0"
    services.nodeports: "0"
    # prod에는 아직 볼륨이 없다. content를 prod에 재적재(ingest)하기로 정하면 이 값을 PR로 올린다.
    persistentvolumeclaims: "0"
