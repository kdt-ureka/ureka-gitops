# EKS prod ureka-frontend values. environments/base/ureka-frontend.yaml 위에 겹친다(Argo CD valueFiles: base → eks/prod, argocd/eks/apps).
# prod는 공개 환경이다. 업무 앱은 수동 Sync: Git PR로 내용을 정하고 반영 시점은 사람이 Argo CD에서 Sync로 승인한다.
# 이미지: EKS dev와 같은 tag·digest(흐름: EC2 dev → EKS dev → EKS prod, 각각 gitops PR).
# 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다(scripts/eks/register_root_app.py).
# DB: 같은 RDS 안의 prod 전용 논리 DB·계정(<db>_prod, <db>_prod_app, #63). Secret 이름·키는 dev와 같고 값만 prod 원본이다.
# base env 중 prod에서 다른 값만 envOverrides로 바꾼다(차트가 env에 없는 이름·Secret 참조 덮어쓰기를 거부한다).

image:
  requireRegistry: true
  repository: ureka/frontend
  tag: sha-133dab1fbeec05d88a9f787c2778ed0b47bce341
  digest: sha256:d4c0d0ffd88239bee2c83646a9af43a5e3884bee8ba6aed8cd83047e671cf9bb
  pullPolicy: IfNotPresent

# EC2 dev와 같은 값. EKS에서 kubectl top으로 다시 잰다.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# nginx는 전체 주소로 넘긴다(base는 dev 네임스페이스). prod 네임스페이스 Service로 바꾼다.
envOverrides:
  AUTH_UPSTREAM: http://ureka-auth.prod.svc.cluster.local
  CHAT_UPSTREAM: http://ureka-chat.prod.svc.cluster.local
  CONTENT_UPSTREAM: http://ureka-content.prod.svc.cluster.local
  OPS_UPSTREAM: http://ureka-ops.prod.svc.cluster.local
