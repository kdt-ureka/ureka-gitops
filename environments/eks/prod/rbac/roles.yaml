# prod 사람 권한(#62). 원칙: 사람은 prod를 직접 바꾸지 않는다. 변경은 Git → Argo CD만.
# 그룹은 EKS access entry(STANDARD, kubernetes_groups)로 IAM 역할과 연결한다. 연결(Terraform)은 별도 변경: docs/eks-namespaces.md
# Kubernetes RBAC은 허용만 더한다. 클러스터 관리자 access entry(비상용)는 이 Role과 관계없이 모든 권한을 가진다.
---
# 팀원 조회용. Secret·exec·attach·port-forward·로그·proxy는 없다(로그에는 사용자 대화 등 개인 정보가 있을 수 있다).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-viewer
  namespace: prod
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, events, persistentvolumeclaims, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts, analysisruns, analysistemplates, experiments]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
# 플랫폼 담당용(prod-viewer와 함께 묶는다). auth 카나리의 승격·중단·재시도만.
# kubectl argo rollouts promote/abort/retry(또는 Argo CD 화면과 같은 patch)는 Rollout 본문과 status 하위 자원을 patch한다.
# 남는 위험: RBAC은 patch할 필드를 좁히지 못해 이 Rollout의 이미지 등도 바꿀 수 있다.
#   → Argo CD selfHeal이 Git 상태로 되돌리고, EKS audit 로그에 남는다. 다른 Rollout·Deployment는 바꿀 수 없다.
# 문제 진단을 위해 prod Pod 로그 조회를 준다(팀원 그룹에는 없음).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-auth-rollout-operator
  namespace: prod
rules:
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status]
    resourceNames: [ureka-auth]
    # get: kubectl patch --subresource=status가 먼저 조회한다(읽기라 추가 위험 없음).
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
