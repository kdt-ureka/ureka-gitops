# EKS prod ureka-auth values. environments/base/ureka-auth.yaml 위에 겹친다(Argo CD valueFiles: base → eks/prod, argocd/eks/apps).
# prod는 공개 환경이다. 업무 앱은 수동 Sync: Git PR로 내용을 정하고 반영 시점은 사람이 Argo CD에서 Sync로 승인한다.
# 이미지: EKS dev와 같은 tag·digest(흐름: EC2 dev → EKS dev → EKS prod, 각각 gitops PR).
# 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다(scripts/eks/register_root_app.py).
# DB: 같은 RDS 안의 prod 전용 논리 DB·계정(<db>_prod, <db>_prod_app, #63). Secret 이름·키는 dev와 같고 값만 prod 원본이다.
# base env 중 prod에서 다른 값만 envOverrides로 바꾼다(차트가 env에 없는 이름·Secret 참조 덮어쓰기를 거부한다).

image:
  requireRegistry: true
  repository: ureka/auth
  tag: sha-6a9754b32bc81ca08779c8eb602c2e58b55b9d0c
  digest: sha256:be8906705b5c7d370e1085df0fc7e36b82ecbe351be7d40a1b6230d7dc96367c
  pullPolicy: IfNotPresent

# JVM: limit 768Mi + base의 -Xmx256m(EC2 dev와 같은 값). EKS에서 kubectl top으로 다시 잰다.
resources:
  requests:
    cpu: 100m # EC2 카나리 시험값(120m)을 원래대로 되돌림
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi

# 카나리(gitops#47을 EKS로 옮김). Argo Rollouts(argocd/eks/argo-rollouts-app.yaml)를 먼저 설치한다.
# 파드 2개: 새 이미지가 오면 1개만 바꾸고(50%) 사람이 승격·중단할 때까지 멈춘다.
# 승격·중단은 Argo CD의 Rollout 동작으로만 한다(AppProject ureka-eks-prod의 auth-rollout-operator 역할, Kubernetes patch 권한 없음 #62).
# 사람별 Argo CD 계정이 생기기 전까지는 관리자가 한다.
replicaCount: 2
rollout:
  enabled: true
  steps:
    - setWeight: 50
    - pause: {}

# prod 논리 DB·계정(#63 이름 규칙). 쿠키는 공개 주소가 https라 Secure로 보낸다(#64 ALB·인증서 전에는 localhost 포트 포워딩으로만 확인).
# 메일: 실제 발송은 SES SMTP(#92, docs/ses.md). 자격(MAIL_USERNAME·MAIL_PASSWORD)은 base env가 Secret ureka-auth-mail에서
# 읽고(#63 ExternalSecret, 원격 비밀 ureka/eks/prod/ses-smtp), 주소·포트·인증·발신 주소는 아래 값이다. 도메인 인증·DKIM·샌드박스 해제 확인 뒤 연결한다.
# SMTP 자격은 prod에서 필수다: Secret ureka-auth-mail이나 키가 없으면 Pod가 시작되지 않아 빈 자격으로 승격되는 일이 없다.
requiredSecretEnv:
  - MAIL_USERNAME
  - MAIL_PASSWORD
envOverrides:
  DB_URL: jdbc:postgresql://postgres:5432/auth_db_prod
  DB_USERNAME: auth_db_prod_app
  COOKIE_SECURE: "true"
  MAIL_HOST: email-smtp.ap-northeast-2.amazonaws.com
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_STARTTLS: "true"
  MAIL_FROM: no-reply@magonjal.com
