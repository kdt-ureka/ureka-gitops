# EKS prod 비밀 연결(charts/ureka-eks-secrets, #63). 계정 ID는 여기 쓰지 않는다(등록 때 파라미터).
environment: prod
# prod 원본: ureka/eks/prod/app은 scripts/eks/seed_prod_secrets.py가 새로 만든다(docs/eks-secrets.md). 시드 전에는 이 앱을 등록하지 않는다.
# ses-smtp: ureka/eks/prod/ses-smtp(SES SMTP 자격, scripts/ses/create-smtp-secret.py) → Secret ureka-auth-mail. 등록 전에 만든다.
# chat-ai: ureka/eks/prod/chat-ai(속성 AI_MODE·AI_API_KEY)는 dev 값을 복사해 만들었다(dev·prod 같은 Gemini 키, 11/25 결정). → Secret ureka-chat-ai.
#   chat(페르소나 생성 등 chat의 AI)과 recommend(GEMINI_API_KEY)가 읽는다. chat 새 이미지가 뜨기 전에 이 Secret이 있어야 한 번에 반영된다.
# turnstile: ureka/eks/prod/turnstile(Cloudflare 비밀키, 단순 문자열) → Secret ureka-auth-turnstile(키 TURNSTILE_SECRET_KEY). auth 봇 확인(auth#44)을 켠다.
enabledBundles: [app, ses-smtp, chat-ai, turnstile]
