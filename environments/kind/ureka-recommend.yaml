# kind(로컬) dev용 ureka-recommend values. chart: charts/ureka-backend
# Python(FastAPI) 서비스도 같은 chart를 쓴다. 포트만 8000.
name: ureka-recommend

replicaCount: 1

# recommend main(계약 v2: POST /internal/v1/recommendations). scripts/kind/sync-ecr-image.sh로 로컬 레지스트리에 복사한 digest.
image:
  repository: localhost:5001/ureka/recommend
  tag: sha-be3038ae1ff49e8ed7327f77ba65e7b6ed9d03e4
  digest: sha256:b93e8f89b46209801406a825cc4d9f9435859a23385b06aa92e355fab71f1da7
  pullPolicy: IfNotPresent

containerPort: 8000

# Gemini·DB 없이 합성 후보로 응답한다(MOCK_CONTENT_IDS 기본값 1건, recommend app/config.py).
# 실제 모드(MOCK_MODE=false, GEMINI_API_KEY·PG_DSN·MAPPING_FILE)는 작품 적재·매핑 파일이 준비된 뒤.
env:
  - name: MOCK_MODE
    value: "true"
  # chat → recommend 내부 호출 확인용. 비어 있으면 recommend가 모든 내부 요청을 401로 거절한다.
  # 값은 다른 서비스와 같다(scripts/kind/create-secrets.sh가 ureka-auth-secrets 값으로 만든다).
  # optional이 아니다: Secret·키가 없으면 새 Pod가 뜨지 않고(CreateContainerConfigError) 기존 Pod가 그대로 남는다.
  # 값이 빈 문자열인지는 검사하지 않는다(빈 값이면 1/1로 떠도 내부 요청은 401).
  - name: INTERNAL_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: ureka-recommend-secrets
        key: INTERNAL_SERVICE_TOKEN

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
