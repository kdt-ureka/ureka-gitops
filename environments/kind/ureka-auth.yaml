# kind(로컬) dev용 ureka-auth values. chart: charts/ureka-backend
# 이미지를 바꾸는 방법(배포·롤백)은 docs/kind-deploy-rollback.md
# DB·Redis는 environments/kind/data(ureka-dev-data-kind), 비밀값은 scripts/kind/create-secrets.sh가 만든 Secret.
name: ureka-auth

replicaCount: 1

# Spring Boot: 힙(MaxRAMPercentage 70%) + 힙 바깥(Metaspace·스레드)이 512Mi를 넘어 OOMKilled → 768Mi
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi

image:
  # kind 로컬 레지스트리. ECR 이미지를 scripts/kind/sync-ecr-image.sh로 digest 그대로 복사해 둔다.
  # ECR 주소에는 계정 ID가 들어가므로 이 PUBLIC 저장소에는 로컬 주소만 적는다.
  repository: localhost:5001/ureka/auth
  # tag = ureka-auth main 커밋, digest = 그 커밋 CI artifact image-ref.json의 digest
  tag: sha-4d8ca370bc2446749d7f3529ad2f7e2e6bb1f2e9
  digest: sha256:22e2953d633581f20d5053972a5d1a6a2db6f4e807ba535c29686b18fd9d2435
  pullPolicy: IfNotPresent

# 이름은 ureka-auth .env.example 기준. 비밀값은 값 대신 Secret 참조만 둔다.
env:
  - name: DB_URL
    value: jdbc:postgresql://postgres:5432/auth_db
  - name: DB_USERNAME
    value: auth_db_app
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: ureka-auth-secrets
        key: DB_PASSWORD
  - name: REDIS_HOST
    value: redis
  - name: REDIS_PORT
    value: "6379"
  - name: JWT_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: ureka-auth-secrets
        key: JWT_PRIVATE_KEY
  - name: JWT_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: ureka-auth-secrets
        key: JWT_PUBLIC_KEY
  - name: EMAIL_CODE_SECRET
    valueFrom:
      secretKeyRef:
        name: ureka-auth-secrets
        key: EMAIL_CODE_SECRET
  - name: INTERNAL_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: ureka-auth-secrets
        key: INTERNAL_SERVICE_TOKEN
  # 탈퇴 전파 대상(같은 네임스페이스 Service). chat은 아직 kind에 없어 탈퇴는 503으로 끝난다.
  - name: CHAT_SERVICE_URL
    value: http://ureka-chat
  - name: CONTENT_SERVICE_URL
    value: http://ureka-content
  # 메일 서버: environments/kind/data/mailpit.yaml (Service mailpit, SMTP 1025, 받기만 하고 밖으로 보내지 않음).
  # 받은 메일은 kubectl -n dev port-forward deploy/mailpit 8025:8025 → http://localhost:8025
  - name: MAIL_HOST
    value: mailpit
  - name: MAIL_PORT
    value: "1025"
  - name: MAIL_SMTP_AUTH
    value: "false"
  - name: MAIL_STARTTLS
    value: "false"
  # kind는 HTTP로 접속한다.
  - name: COOKIE_SECURE
    value: "false"
