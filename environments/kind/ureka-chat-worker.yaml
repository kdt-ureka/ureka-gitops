# kind(로컬) dev용 ureka-chat worker values. chart: charts/ureka-backend
# api(ureka-chat.yaml)와 같은 이미지·env로 `python -m app.worker`를 띄운다. 요청을 받지 않아 Service·포트가 없다.
# Argo CD Application ureka-chat-kind에 api와 함께 묶여 있어 PreSync 마이그레이션 뒤에 갱신된다. 마이그레이션 Job은 api values에만 있다.
# HTTP 헬스 체크가 없고 상태 파일도 쓰지 않아 헬스 체크를 끈다. 프로세스가 죽으면 컨테이너가 재시작된다.
# env는 ureka-chat.yaml과 같아야 한다(scripts/check-charts.sh가 비교한다).
name: ureka-chat-worker

replicaCount: 1

image:
  repository: localhost:5001/ureka/chat
  tag: sha-8cffeee34f0f50e18baeeed5523c3822f85c45ed
  digest: sha256:7ca4f9815798950e2c384dc43b331d97de2c4317d4b0f76dce8e4716689fbfca
  pullPolicy: IfNotPresent

command: ["python", "-m", "app.worker"]

service:
  enabled: false

probes:
  enabled: false

# 2026-11-12 kind 측정(kubectl top, AI 꺼짐·유휴, 1분 6회): 91~92Mi, cgroup 최대 97Mi, CPU 160~172m.
# 유휴인데 CPU가 높은 이유: 작업이 없으면 0.1초마다 정리 쿼리 3개 + 작업 조회를 반복한다(app/worker.py main). chat 담당 확인 필요.
# limit은 AI 호출(해석·답변)을 모르는 상태라 약 4배 여유. EC2에서 AI를 켜고 다시 잰다. 개수는 부하 시험(S10) 때 정한다.
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

# 이름은 ureka-chat .env.example·docs/deployment-handoff.md, ureka-local compose 기준.
env:
  # DB_PASSWORD를 DATABASE_URL보다 먼저 둬야 $(DB_PASSWORD)가 치환된다. 비밀번호는 16진수라 URL 인코딩이 필요 없다.
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: ureka-chat-secrets
        key: DB_PASSWORD
  - name: DATABASE_URL
    value: postgresql+psycopg://chat_db_app:$(DB_PASSWORD)@postgres:5432/chat_db
  - name: AUTH_CONTRACT_MODE
    value: jwt
  - name: JWT_ISSUER
    value: ureka-auth
  - name: JWT_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: ureka-chat-secrets
        key: JWT_PUBLIC_KEY
  - name: INTERNAL_SERVICE_TOKEN
    valueFrom:
      secretKeyRef:
        name: ureka-chat-secrets
        key: INTERNAL_SERVICE_TOKEN
  # kind Service 주소(Service 포트 80 → 컨테이너 8080·recommend 8000)
  - name: CONTENT_BASE_URL
    value: http://ureka-content
  - name: RECOMMEND_BASE_URL
    value: http://ureka-recommend
  - name: API_DOCS_ENABLED
    value: "false"
  # AI는 선택. Secret ureka-chat-ai(AI_MODE=gemini, AI_API_KEY)가 있을 때만 켜진다(create-secrets.sh --chat-ai).
  # 없으면 두 값이 비어 앱 기본값 AI_MODE=disabled로 동작한다. AI_MODE를 여기에 값으로 쓰지 않는다.
  - name: AI_MODE
    valueFrom:
      secretKeyRef:
        name: ureka-chat-ai
        key: AI_MODE
        optional: true
  - name: AI_API_KEY
    valueFrom:
      secretKeyRef:
        name: ureka-chat-ai
        key: AI_API_KEY
        optional: true
  - name: AI_INTERPRET_MODEL
    value: gemini-3.1-flash-lite
  - name: AI_ANSWER_MODEL
    value: gemini-3.1-flash-lite
  - name: AI_PERSONA_MODEL
    value: gemini-3.1-flash-lite
  - name: AI_MAX_ATTEMPTS
    value: "3"
