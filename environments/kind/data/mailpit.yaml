# kind dev 메일 서버(Mailpit). auth가 보내는 가입 인증 메일을 받기만 하고 밖으로 보내지 않는다.
# 클러스터 안에는 SMTP(1025)만 Service로 연다. 메일 화면(8025)은 Pod 안 127.0.0.1에만 열어 다른 Pod에서 닿지 않고,
# Service·Ingress 없이 port-forward로만 본다:
#   kubectl -n dev port-forward deploy/mailpit 8025:8025   → http://localhost:8025
# 저장하지 않는다(Pod가 다시 뜨면 메일이 비워진다). 운영은 실제 메일 발송 서비스로 따로 정한다.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: ureka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: ureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: ureka
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          # v1.32.0
          image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
          imagePullPolicy: IfNotPresent
          env:
            # 메일 DB는 /tmp(emptyDir)의 임시 파일. 오래된 메일부터 지워 개수를 제한한다.
            - name: MP_MAX_MESSAGES
              value: "200"
            # 메일 화면·API는 Pod 안에서만. port-forward는 Pod 안 127.0.0.1로 붙으므로 그대로 쓸 수 있다.
            - name: MP_UI_BIND_ADDR
              value: 127.0.0.1:8025
          ports:
            - name: smtp
              containerPort: 1025
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # 화면이 127.0.0.1에만 열려 있어 HTTP 헬스 체크(Pod IP) 대신 Pod 안에서 확인한다.
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
