# kind dev 데이터 계층: PostgreSQL(pgvector) + Redis + 계정 생성 Job. Argo CD Application ureka-dev-data-kind가 동기화한다.
# Secret(postgres-admin, db-accounts, 서비스별 *-secrets)은 Git에 없다. scripts/kind/create-secrets.sh로 먼저 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - postgres.yaml
  - redis.yaml
  - db-bootstrap-job.yaml
configMapGenerator:
  # SQL을 바꾸면 이름(해시)이 바뀌어 Job도 새 내용으로 돈다.
  - name: db-bootstrap
    files:
      - db-bootstrap.sql
