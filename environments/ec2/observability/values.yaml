components:
  prometheus:
    repository: prom/prometheus
    tag: v3.16.0
    digest: sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    port: 9090
    uid: 65534
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: 500m, memory: 1Gi}
  grafana:
