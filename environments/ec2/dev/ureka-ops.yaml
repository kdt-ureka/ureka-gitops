# EC2 dev(k3s) ureka-ops values. environments/base/ureka-ops.yaml 위에 겹친다(Argo CD valueFiles: base → ec2/dev).
# 여기에는 EC2 dev만 다른 값만 둔다: 이미지 digest, 메모리.
# 이미지: ECR에서 노드(kubelet)가 바로 받는다. 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다.
# 이미지를 바꾸는 방법: 서비스 CI artifact(image-ref.json)의 tag·digest로 이 파일을 고치는 PR. kind와 같은 digest면 kind에서 검증한 이미지다.

image:
  requireRegistry: true
  repository: ureka/ops
  tag: sha-895b3c0daaca2c15f720037c23789c0babcd1f6a
  digest: sha256:25cf8667f5b857bfeeb29644a983214a418b93372b6523acfea58e871af1fdc3
  pullPolicy: IfNotPresent

# JVM: limit 768Mi + base의 -Xmx256m. 첫날 x86 측정(kubectl top·cgroup 최대)으로 다시 정한다.
# (kind ops는 차트 기본 512Mi였다. EC2는 다른 JVM 서비스와 같은 값으로 맞추고 측정한다.)
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
