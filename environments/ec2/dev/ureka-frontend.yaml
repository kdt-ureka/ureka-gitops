# EC2 dev(k3s) ureka-frontend values. environments/base/ureka-frontend.yaml 위에 겹친다(Argo CD valueFiles: base → ec2/dev).
# 여기에는 EC2 dev만 다른 값만 둔다: 이미지 digest, 메모리, Ingress.
# 이미지: ECR에서 노드(kubelet)가 바로 받는다. 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다.
# 이미지를 바꾸는 방법: 서비스 CI artifact(image-ref.json)의 tag·digest로 이 파일을 고치는 PR. kind와 같은 digest면 kind에서 검증한 이미지다.

image:
  requireRegistry: true
  repository: ureka/frontend
  tag: sha-3344d570b2a6b39609ebb24385564e8a40b0f609
  digest: sha256:3d9edbfcc2c702a77f07bb3668fb459129656883a48037c7d8dc980f38789ebf
  pullPolicy: IfNotPresent

# kind 측정값 기준 그대로. EC2 x86에서 다시 잰다.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# 터널(SSM 80번) → Traefik → 이 Service. /api/*는 frontend nginx가 각 서비스로 넘긴다(입구는 하나).
ingress:
  enabled: true
  className: traefik
