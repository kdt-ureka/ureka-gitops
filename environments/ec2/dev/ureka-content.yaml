# EC2 dev(k3s) ureka-content values. environments/base/ureka-content.yaml 위에 겹친다(Argo CD valueFiles: base → ec2/dev).
# 여기에는 EC2 dev만 다른 값만 둔다: 이미지 digest, 메모리.
# 이미지: ECR에서 노드(kubelet)가 바로 받는다. 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다.
# 이미지를 바꾸는 방법: 서비스 CI artifact(image-ref.json)의 tag·digest로 이 파일을 고치는 PR. kind와 같은 digest면 kind에서 검증한 이미지다.

image:
  requireRegistry: true
  repository: ureka/content
  # content main 4790011: V15(국가 기준정보, ingest 적재 FK 전제)~V18(매핑 버전), 선택형 JVM 지표(#42, 이 환경은 꺼짐).
  tag: sha-47900118a2001a3e1c8126c87c23de7d7a9630dc
  digest: sha256:43d1919c26693137d87c19fa5f4bbb9fe073a4f7eeaa3ad9e750c9c7b2d0a23b
  pullPolicy: IfNotPresent

# JVM: limit 768Mi + base의 -Xmx256m. 첫날 x86 측정(kubectl top·cgroup 최대)으로 다시 정한다.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
