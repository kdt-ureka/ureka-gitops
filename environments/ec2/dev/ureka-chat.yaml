# EC2 dev(k3s) ureka-chat values. environments/base/ureka-chat.yaml 위에 겹친다(Argo CD valueFiles: base → ec2/dev).
# 여기에는 EC2 dev만 다른 값만 둔다: 이미지 digest, 메모리.
# 이미지: ECR에서 노드(kubelet)가 바로 받는다. 레지스트리 주소(계정 ID 포함)는 Git에 쓰지 않고 root 앱이 image.registry로 넣는다.
# 이미지를 바꾸는 방법: 서비스 CI artifact(image-ref.json)의 tag·digest로 이 파일을 고치는 PR. kind와 같은 digest면 kind에서 검증한 이미지다.

image:
  requireRegistry: true
  repository: ureka/chat
  tag: sha-9e87f390928a186c3fa6911419bf9b4796d180e4
  digest: sha256:7aeff3ba99cd1636e8842289bb71901173db6040bb2ae898625f24432fdb1c3c
  pullPolicy: IfNotPresent

# kind 측정값 기준 그대로. EC2 x86에서 다시 잰다.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
