# RDS에 서비스 DB·계정·vector 확장을 만드는 Job(EC2 dev). Argo CD가 관리하지 않는다.
# scripts/ec2/rds-bootstrap.sh만 만든다: 마스터 Secret(rds-master) 만들기 → 이 Job → 완료 대기 → 마스터 Secret 삭제.
# SQL·본문은 kind와 같은 environments/kind/data/db-bootstrap.sql·run-bootstrap.sh(ConfigMap db-bootstrap-rds).
# 실행 계정은 RDS 마스터(rds_superuser, 슈퍼유저 아님): SQL의 is_superuser=f 경로로 돈다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap-rds
  namespace: dev
  labels:
    app.kubernetes.io/name: db-bootstrap-rds
    app.kubernetes.io/part-of: ureka
spec:
  # 실패하면 다시 만들지 않는다. 스크립트가 로그를 보여 주고 마스터 Secret을 지운다.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  # 끝난 뒤 1시간 동안 로그를 볼 수 있게 남긴다.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap-rds
        app.kubernetes.io/part-of: ureka
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          # kind postgres와 같은 이미지(psql 18, \getenv 지원). 서버 pgvector 버전은 RDS가 정한다.
          image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/run-bootstrap.sh"]
          env:
            # Service postgres = RDS ExternalName(environments/ec2/dev/data)
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: postgres
            # RDS는 TLS만 받는다(rds.force_ssl=1). 인증서 이름 확인(verify-full)은 하지 않는다: 호스트가 ExternalName 별칭이다.
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: rds-master
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-master
                  key: PGPASSWORD
          envFrom:
            - secretRef:
                name: db-accounts
            - secretRef:
                name: db-accounts-chat-ops
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: db-bootstrap-rds
