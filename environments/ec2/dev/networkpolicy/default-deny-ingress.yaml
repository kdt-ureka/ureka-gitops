# (#39) dev 네임스페이스의 모든 Pod는 기본으로 들어오는 연결을 받지 않는다.
# 필요한 연결은 allow-ingress.yaml(#40)이 대상 Pod별로 연다. NetworkPolicy는 합집합이라 허용 정책이 하나라도 맞으면 통과한다.
# 이 파일만 따로 배포하면 모든 서비스가 끊긴다. 두 파일은 같은 Argo CD Application(ureka-dev-networkpolicy-*)으로 함께 배포한다.
#
# 이번 범위는 들어오는 연결(ingress)만이다. 나가는 연결(egress)은 막지 않는다(DNS·RDS·Gemini 등은 그대로 나간다).
# 예외: ingest Job(environments/ec2/dev/ingest/networkpolicy.yaml)은 자체 정책으로 egress까지 막고 있고, 이 정책과 충돌하지 않는다.
#
# 이 정책으로 바뀌지 않는 것:
# - kubectl port-forward·exec·logs(kubelet 경로라 NetworkPolicy를 거치지 않는다. Mailpit 8025 확인도 port-forward로 한다).
# - kubelet 헬스 체크(같은 노드에서 오는 연결. k3s의 kube-router는 노드 → Pod를 허용한다. kind 시험으로도 확인한다).
# - Argo CD 동기화(Argo CD는 API 서버와 통신하고 dev Pod에 직접 연결하지 않는다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-default-deny-ingress
  namespace: dev
  labels:
    app.kubernetes.io/part-of: ureka
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
