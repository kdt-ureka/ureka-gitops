rule_files:
  - ../../charts/ureka-observability/files/rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="ureka-auth",instance="test"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: ScrapeTargetDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ScrapeTargetDown
        exp_alerts:
          - exp_labels: {job: ureka-auth, instance: test, severity: warning}
            exp_annotations: {summary: '수집 대상에 5분간 접근하지 못함'}
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="dev",pod="auth-test",container="app",image="test"}'
        values: '900x15'
      - series: 'kube_pod_container_resource_limits{namespace="dev",pod="auth-test",resource="memory",unit="byte"}'
        values: '1000x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: PodMemoryNearLimit
        exp_alerts: []
      - eval_time: 11m
        alertname: PodMemoryNearLimit
        exp_alerts:
          - exp_labels: {namespace: dev, pod: auth-test, severity: warning}
            exp_annotations: {summary: 'Pod working set이 설정된 메모리 한도의 85% 초과'}
