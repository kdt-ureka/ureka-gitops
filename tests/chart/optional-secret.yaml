# requiredSecretEnv 시험(scripts/test-chart-options.sh)용. api-with-migration.yaml 위에 겹친다.
# base env처럼 Secret 참조가 optional=true인 상태에서, 환경이 필수로 올리는 경우를 본다.
env:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: example-secrets
        key: DB_PASSWORD
  - name: MAIL_USERNAME
    valueFrom:
      secretKeyRef:
        name: example-mail
        key: MAIL_USERNAME
        optional: true
  - name: MAIL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: example-mail
        key: MAIL_PASSWORD
        optional: true
  - name: DATABASE_URL
    value: postgresql+psycopg://example:$(DB_PASSWORD)@postgres:5432/example_db
