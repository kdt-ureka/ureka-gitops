# 공통 기본값. 환경·서비스별 값은 environments/<환경>/<서비스>.yaml에서 덮어쓴다.

# 리소스 이름과 app.kubernetes.io/name 라벨 (예: ureka-auth)
name: ""

replicaCount: 1

# 카나리 배포(Argo Rollouts). 기본은 끔: 꺼 두면 지금과 같은 Deployment가 나온다.
# 켜면 Deployment 대신 Rollout을 만들고 steps대로 단계를 밟는다(예: setWeight 50 → pause {}).
# 클러스터에 Argo Rollouts(argocd/ec2/argo-rollouts-app.yaml)가 먼저 설치돼 있어야 한다.
rollout:
  enabled: false
  steps: []

image:
  # 레지스트리 주소(host[:port]). 값이 있으면 registry/repository로 받는다.
  # kind는 비워 두고 repository에 로컬 주소(localhost:5001/...)를 통째로 쓴다.
  # EC2·EKS는 ECR 주소에 계정 ID가 있어 Git에 쓰지 않는다. 배포할 때 root 앱이 넣는다(argocd/ec2).
  registry: ""
  # true면 registry가 비어 있을 때 렌더링을 실패시킨다(EC2·EKS values에서 켠다).
  requireRegistry: false
  repository: ""
  tag: ""
  # 정식 경로(ECR)에서는 digest를 채운다. 값이 있으면 tag 대신 repository@digest로 배포한다.
  digest: ""
  pullPolicy: IfNotPresent

# 실행 명령. 비워 두면 이미지의 ENTRYPOINT·CMD를 그대로 쓴다.
# 같은 이미지로 다른 프로그램을 띄울 때만 준다 (예: chat worker → command: [python, -m, app.worker]).
command: []
args: []

containerPort: 8080

service:
  # false면 Service와 컨테이너 포트(http)를 만들지 않는다. 요청을 받지 않는 프로그램(worker)용.
  # 이때 기본 HTTP 헬스 체크는 쓸 수 없다. probes.enabled=false로 끄거나 probes.startup·liveness·readiness를 직접 준다.
  enabled: true
  port: 80

# 클러스터 밖 요청을 이 Service로 넘기는 Ingress. 기본은 끔. 지금은 frontend만 켠다(frontend nginx가 /api/*를 각 서비스로 넘긴다).
ingress:
  enabled: false
  # EC2 k3s: traefik(기본 내장). EKS는 alb로 바꾼다.
  className: ""
  # 비우면 모든 호스트 이름을 받는다(EC2는 SSM 터널로만 들어와 호스트 이름이 localhost다).
  host: ""
  annotations: {}
  paths:
    - path: /
      pathType: Prefix

# 모든 백엔드가 같은 경로를 쓴다 (/healthz: 앱이 살아 있는지, /readyz: 요청을 받을 준비가 됐는지)
probes:
  # false면 startup·liveness·readiness 헬스 체크를 모두 넣지 않는다.
  enabled: true
  livenessPath: /healthz
  readinessPath: /readyz
  # 값을 주면 해당 헬스 체크를 기본 HTTP 대신 이 내용 그대로 쓴다 (Kubernetes probe 형식, 예: exec·tcpSocket).
  startup: {}
  liveness: {}
  readiness: {}

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 512Mi

# 비밀값이 아닌 환경 변수만 둔다. 비밀값은 S6 이후 ESO(Secrets Manager)로 넣는다.
env: []
# env 중 일부 값만 바꿀 때(이름 → 문자열). 목록 전체를 복사하지 않는다(예: EKS prod의 DB 이름·frontend 넘김 주소).
# env에 없는 이름, Secret 참조(valueFrom) 항목, 문자열이 아닌 값은 렌더링이 실패한다.
envOverrides: {}

# DB 마이그레이션 Job (Argo CD PreSync 훅). Deployment와 같은 이미지·env·보안 설정에 실행 명령만 다르다.
# 앱이 기동할 때 스스로 마이그레이션하는 서비스(Flyway: auth·content·ops)는 쓰지 않는다.
migration:
  enabled: false
  # enabled=true이면 필수 (예: chat → [python, -m, alembic, upgrade, head])
  command: []
  args: []
  # Job 안에서의 재시도 횟수(Pod를 다시 만드는 횟수). 기본 0: 한 번 실패하면 이번 동기화를 실패로 끝낸다.
  # Argo CD Application의 sync 재시도(syncPolicy.retry)와는 별개다. Application에 retry가 있으면 Argo가 동기화를 다시 시도하면서
  # 이 Job을 새로 만들어 마이그레이션이 다시 돈다(이전 Job과 로그는 그때 지워진다). 마이그레이션은 다시 실행해도 안전해야 한다.
  # 실패하면 같은 Application의 Deployment 갱신은 진행되지 않지만, 이미 바뀐 DB는 자동으로 되돌리지 않는다.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  # 비워 두면 위 resources를 쓴다.
  resources: {}

# EC2 관측: 서비스 승인 이미지 이후 환경에서만 켠다. 업무 Service는 바꾸지 않음.
metrics:
  enabled: false
