{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "ingress.enabled=true needs service.enabled=true (Ingress sends requests to this Service)" }}
{{- end }}
{{- $name := include "ureka-backend.name" . }}
{{- $port := .Values.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "ureka-backend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required when ingress.enabled=true (e.g. traefik)" .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range required "ingress.paths must not be empty" .Values.ingress.paths }}
          - path: {{ required "ingress.paths[].path is required" .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $port }}
          {{- end }}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
