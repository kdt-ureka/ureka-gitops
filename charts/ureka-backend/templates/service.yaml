apiVersion: v1
kind: Service
metadata:
  name: {{ include "ureka-backend.name" . }}
  labels:
    {{- include "ureka-backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ureka-backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
