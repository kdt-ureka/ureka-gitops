{{- include "ureka-backend.validate" . -}}
{{- include "ureka-backend.validateMetrics" . -}}
{{- if and .Values.rollout.enabled (not .Values.rollout.steps) }}
{{- fail "rollout.enabled=true면 rollout.steps(카나리 단계)가 필요하다" }}
{{- end }}
{{- /* rollout.enabled면 Argo Rollouts의 Rollout으로 만든다(gitops#47). 클러스터에 Argo Rollouts가 먼저 설치돼 있어야 한다. 그 밖의 내용은 Deployment와 같다. */}}
{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "ureka-backend.name" . }}
  labels:
    {{- include "ureka-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.rollout.enabled }}
  strategy:
    canary:
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ureka-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ureka-backend.labels" . | nindent 8 }}
    spec:
      # 앱이 Kubernetes API를 부르지 않으므로 서비스 계정 토큰을 넣지 않는다.
      automountServiceAccountToken: false
      securityContext:
        {{- include "ureka-backend.podSecurityContext" . | nindent 8 }}
      containers:
        - name: app
          image: {{ include "ureka-backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9091
          {{- end }}
          {{- end }}
          {{- if or .Values.env .Values.metrics.enabled }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: SPRING_PROFILES_INCLUDE
              value: observability
            - name: METRICS_SCRAPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-metrics" .Values.name | quote }}
                  key: METRICS_SCRAPE_TOKEN
            {{- end }}
          {{- end }}
          securityContext:
            {{- include "ureka-backend.containerSecurityContext" . | nindent 12 }}
          {{- if .Values.probes.enabled }}
          # 기동이 끝날 때까지 liveness를 미룬다 (JVM 기동이 느려도 재시작되지 않게).
          startupProbe:
            {{- if .Values.probes.startup }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            periodSeconds: 2
            failureThreshold: 60
            {{- end }}
          livenessProbe:
            {{- if .Values.probes.liveness }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
            {{- end }}
          readinessProbe:
            {{- if .Values.probes.readiness }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # 루트 파일 시스템이 읽기 전용이라 Tomcat 임시 파일용 쓰기 공간만 따로 준다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
