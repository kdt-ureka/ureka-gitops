# prod 공개 입구 기본값. 환경 값은 environments/eks/prod/public-ingress.yaml. 설명은 docs/eks-public.md.
# 비우면 렌더링이 실패한다(주소 없이 Ingress를 만들지 않는다).
host: ""
# ALB 헬스 체크. 프론트(nginx)와 백엔드 모두 /healthz가 있다(앱 상태만 보는 /readyz는 nginx에 없음).
healthcheckPath: /healthz
# 경로 → Service. Service 포트는 차트 기본 80. NetworkPolicy는 Pod 포트(containerPort)를 본다.
# recommend는 내부 전용이라 넣지 않는다. 넣으면 렌더링이 실패한다.
routes:
  - path: /api/auth
    service: ureka-auth
  - path: /api/chat
    service: ureka-chat
  - path: /api/content
    service: ureka-content
  - path: /api/admin
    service: ureka-ops
  - path: /
    service: ureka-frontend
servicePort: 80
podPort: 8080
# ALB → Pod 허용 NetworkPolicy. 기본 끔: 켜면 공개 5서비스가 격리되어, prod 내부 허용 정책(#49)이 없으면 서비스 간 호출이 끊긴다.
# prod 기본 거부·내부 허용이 들어올 때 같이 켜고, 채팅 → 추천 → 작품 조회 흐름까지 시험한다(docs/eks-public.md).
albNetworkPolicy:
  enabled: false
# ALB(대상 ip 방식)가 Pod로 직접 연결하는 출발지 = 공개 서브넷(ALB 노드가 이 안에 있다).
# 서브넷 CIDR은 infra/environments/network/main.tf의 cidrsubnet(vpc_cidr, 8, 0..1)과 같다(사설 주소라 공개 저장소에 써도 된다).
albSourceCidrs:
  - 10.0.0.0/24
  - 10.0.1.0/24
