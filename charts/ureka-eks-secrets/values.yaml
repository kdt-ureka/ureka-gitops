# EKS 환경별 비밀 연결(#63). 환경 values(environments/eks/<env>/secrets.yaml)가 environment를 정한다.
# awsAccountId는 PUBLIC 저장소에 쓰지 않는다. scripts/eks/register_secrets_app.py가 등록할 때 Application 파라미터로 넣는다.
environment: ""
awsAccountId: ""
awsRegion: ap-northeast-2
projectName: ureka
# Terraform infra/environments/eks/secrets.tf의 신뢰 조건(system:serviceaccount:<env>:<이름>)과 같아야 한다.
readerServiceAccount: ureka-secrets-reader
# 리더 서비스계정 토큰을 발급받아도 되는 유일한 주체(ESO 컨트롤러, argocd/eks/external-secrets-app.yaml).
# Role·RoleBinding의 대상과 VAP의 허용 사용자가 이 값에서 나온다.
esoControllerServiceAccount:
  namespace: external-secrets
  name: external-secrets
refreshInterval: 1h

# Secrets Manager 비밀(묶음) → 만들 Kubernetes Secret → 키: 묶음 안의 JSON 속성.
# 묶음 이름은 <projectName>/eks/<environment>/<묶음>. 같은 값(JWT 공개키·내부 토큰)은 속성 하나를 여러 Secret이 같이 쓴다.
# Secret 이름·키는 scripts/kind/create-secrets.sh가 만드는 것과 같다(앱 values의 secretKeyRef를 바꾸지 않기 위해).
# dev가 켜는 묶음(app, chat-ai)을 바꾸면 scripts/ec2/copy_eks_dev_secrets.py의 BUNDLES도 같이 바꾼다
# (tests/eks/test_copy_eks_dev_secrets.py가 비교). app 속성은 prod 시드 scripts/eks/seed_prod_secrets.py와도 같아야 한다.
bundles:
  app:
    ureka-auth-secrets:
      DB_PASSWORD: AUTH_DB_PASSWORD
      JWT_PRIVATE_KEY: JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      EMAIL_CODE_SECRET: EMAIL_CODE_SECRET
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-content-secrets:
      DB_PASSWORD: CONTENT_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-chat-secrets:
      DB_PASSWORD: CHAT_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-ops-secrets:
      DB_PASSWORD: OPS_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
    ureka-recommend-secrets:
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-recommend-db:
      DB_USERNAME: RECOMMEND_DB_USERNAME
      DB_PASSWORD: RECOMMEND_DB_PASSWORD
    ureka-ingest-db:
      DB_USERNAME: INGEST_DB_USERNAME
      DB_PASSWORD: INGEST_DB_PASSWORD
  # Gemini 키는 교체 주기·담당이 달라 따로 둔다. 앱은 이 Secret을 optional로 읽는다.
  chat-ai:
    ureka-chat-ai:
      AI_MODE: AI_MODE
      AI_API_KEY: AI_API_KEY
  # prod auth 실제 메일(SES SMTP, gitops#91). 원격 비밀 ureka/eks/prod/ses-smtp는 scripts/ses/create-smtp-secret.py가 만든다.
  # prod만 켠다(dev는 Mailpit). 서비스 Secret과 따로 둔다: SMTP 자격은 교체 주기·담당이 다르고, ExternalSecret 하나가 Secret 하나를 소유한다.
  # auth가 이 Secret을 읽으려면 auth values에 MAIL_USERNAME·MAIL_PASSWORD 참조가 필요하다(#43 후속, docs/eks-secrets.md 'prod 메일').
  ses-smtp:
    ureka-auth-mail:
      MAIL_USERNAME: MAIL_USERNAME
      MAIL_PASSWORD: MAIL_PASSWORD
  # prod auth 봇 확인(Turnstile, auth#44) 비밀키. 원격 비밀 ureka/eks/prod/turnstile은 JSON이 아니라 값 하나(단순 문자열)다.
  # 속성 이름을 빈 문자열로 두면 ExternalSecret이 property 없이 비밀 전체 값을 읽는다(차트 규칙).
  turnstile:
    ureka-auth-turnstile:
      TURNSTILE_SECRET_KEY: ""

# 비밀 전체 값을 읽어도 되는 항목(묶음/Secret/키). 원격 비밀이 JSON이 아니라 값 하나일 때만 쓰고, 속성 이름은 빈 문자열이다.
# 여기에 없는 항목의 빈 속성은 렌더링 실패다(다른 서비스 자격이 든 JSON 전체가 Secret에 들어가는 실수를 막는다).
wholeValueAllowed:
  - turnstile/ureka-auth-turnstile/TURNSTILE_SECRET_KEY

# 이 환경에서 실제로 연결할 묶음. 원격 비밀이 아직 없는 묶음은 빼 둔다(ExternalSecret이 오류 상태로 남지 않게).
enabledBundles: [app, chat-ai]
