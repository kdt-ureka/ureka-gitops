# EKS 환경별 비밀 연결(#63). 환경 values(environments/eks/<env>/secrets.yaml)가 environment를 정한다.
# awsAccountId는 PUBLIC 저장소에 쓰지 않는다. scripts/eks/register_secrets_app.py가 등록할 때 Application 파라미터로 넣는다.
environment: ""
awsAccountId: ""
awsRegion: ap-northeast-2
projectName: ureka
# Terraform infra/environments/eks/secrets.tf의 신뢰 조건(system:serviceaccount:<env>:<이름>)과 같아야 한다.
readerServiceAccount: ureka-secrets-reader
# 리더 서비스계정 토큰을 발급받아도 되는 유일한 주체(ESO 컨트롤러, argocd/eks/external-secrets-app.yaml).
esoControllerUser: system:serviceaccount:external-secrets:external-secrets
refreshInterval: 1h

# Secrets Manager 비밀(묶음) → 만들 Kubernetes Secret → 키: 묶음 안의 JSON 속성.
# 묶음 이름은 <projectName>/eks/<environment>/<묶음>. 같은 값(JWT 공개키·내부 토큰)은 속성 하나를 여러 Secret이 같이 쓴다.
# Secret 이름·키는 scripts/kind/create-secrets.sh가 만드는 것과 같다(앱 values의 secretKeyRef를 바꾸지 않기 위해).
# 이 표를 바꾸면 scripts/ec2/copy_eks_dev_secrets.py의 MAPPING도 같이 바꾼다(tests/eks/test_secret_mapping.py가 비교).
bundles:
  app:
    ureka-auth-secrets:
      DB_PASSWORD: AUTH_DB_PASSWORD
      JWT_PRIVATE_KEY: JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      EMAIL_CODE_SECRET: EMAIL_CODE_SECRET
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-content-secrets:
      DB_PASSWORD: CONTENT_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-chat-secrets:
      DB_PASSWORD: CHAT_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-ops-secrets:
      DB_PASSWORD: OPS_DB_PASSWORD
      JWT_PUBLIC_KEY: JWT_PUBLIC_KEY
    ureka-recommend-secrets:
      INTERNAL_SERVICE_TOKEN: INTERNAL_SERVICE_TOKEN
    ureka-recommend-db:
      DB_USERNAME: RECOMMEND_DB_USERNAME
      DB_PASSWORD: RECOMMEND_DB_PASSWORD
    ureka-ingest-db:
      DB_USERNAME: INGEST_DB_USERNAME
      DB_PASSWORD: INGEST_DB_PASSWORD
  # Gemini 키는 교체 주기·담당이 달라 따로 둔다. 앱은 이 Secret을 optional로 읽는다.
  chat-ai:
    ureka-chat-ai:
      AI_MODE: AI_MODE
      AI_API_KEY: AI_API_KEY

# 이 환경에서 실제로 연결할 묶음. 원격 비밀이 아직 없는 묶음은 빼 둔다(ExternalSecret이 오류 상태로 남지 않게).
enabledBundles: [app, chat-ai]
