{{- $env := include "ekssecrets.env" . }}
{{- $root := . }}
{{- range $bundle := .Values.enabledBundles }}
{{- $targets := required (printf "bundles.%s가 없습니다" $bundle) (index $root.Values.bundles $bundle) }}
{{- range $target, $keys := $targets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $target }}
  namespace: {{ $env }}
  labels:
    {{- include "ekssecrets.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: ureka-aws-secrets
  target:
    name: {{ $target }}
    # ExternalSecret이 지워지면 Secret도 지운다. 원격 비밀이 사라져도 마지막 값은 남긴다(앱이 바로 내려가지 않게).
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key, $property := $keys }}
    {{- /* 속성이 비어 있으면 비밀 전체 값을 읽는다. 다른 서비스의 자격이 든 JSON 전체가 새지 않도록 wholeValueAllowed에 적은 항목만 허용하고, 그 밖의 빈 값·null·문자열 아님은 렌더링을 실패시킨다. */ -}}
    {{- $id := printf "%s/%s/%s" $bundle $target $key }}
    {{- if has $id $root.Values.wholeValueAllowed }}
    {{- if ne (toString $property) "" }}{{ fail (printf "bundles.%s: wholeValueAllowed 항목은 속성 이름이 빈 문자열이어야 한다" $id) }}{{ end }}
    {{- else }}
    {{- if not (and (kindIs "string" $property) (ne $property "")) }}{{ fail (printf "bundles.%s: 속성 이름이 비었거나 문자열이 아니다. 비밀 전체를 읽는 항목은 wholeValueAllowed에 적은 것만 허용한다" $id) }}{{ end }}
    {{- end }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $root.Values.projectName }}/eks/{{ $env }}/{{ $bundle }}
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
