{{- $env := include "ekssecrets.env" . }}
{{- $account := include "ekssecrets.account" . }}
# 환경 리더 서비스계정. Pod는 이 계정을 쓰지 않는다(아래 guard가 거부). ESO만 TokenRequest로 토큰을 받는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.readerServiceAccount }}
  namespace: {{ $env }}
  labels:
    {{- include "ekssecrets.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ $account }}:role/{{ .Values.projectName }}-eks-eso-{{ $env }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ureka-aws-secrets
  namespace: {{ $env }}
  labels:
    {{- include "ekssecrets.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.readerServiceAccount }}
