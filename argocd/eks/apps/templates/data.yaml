{{- /* 데이터 계층(Service postgres → 같은 RDS, Redis, Mailpit). 서비스보다 먼저(wave -1). Secret은 Git에 없다(#63 ESO). */ -}}
{{- range .Values.environments }}
{{- $env := include "eksapps.envName" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-eks-data-{{ $env }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: ureka-eks-{{ $env }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: environments/eks/{{ $env }}/data
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $env }}
  {{- include "eksapps.syncPolicy" . | nindent 2 }}
{{- end }}
