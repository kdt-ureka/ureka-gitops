{{- /* 서비스 앱. 공통 차트에 values 두 겹(base → eks/<환경>)을 주고, 레지스트리 주소를 image.registry로 넘긴다. */ -}}
{{- $registry := include "eksapps.registry" . }}
{{- range $e := .Values.environments }}
{{- $env := include "eksapps.envName" $e }}
{{- range $.Values.services }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-{{ .name }}-eks-{{ $env }}
  namespace: argocd
spec:
  project: ureka-eks-{{ $env }}
  sources:
    {{- range required (printf "services[%s].releases must not be empty" .name) .releases }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      path: charts/ureka-backend
      helm:
        releaseName: {{ . }}
        valueFiles:
          - ../../environments/base/ureka-{{ . }}.yaml
          - ../../environments/eks/{{ $env }}/ureka-{{ . }}.yaml
        parameters:
          - name: image.registry
            value: {{ $registry | quote }}
          {{- if or (eq . "auth") (eq . "content") }}
          - name: metrics.enabled
            value: {{ $.Values.jvmMetricsEnabled | quote }}
          {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $env }}
  {{- include "eksapps.syncPolicy" $e | nindent 2 }}
{{- end }}
{{- end }}
