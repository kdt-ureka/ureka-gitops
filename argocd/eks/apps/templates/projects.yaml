{{- /*
AppProject 3개. 앱이 만들 수 있는 자원을 줄인다(Argo CD가 동기화 때 거부한다).
- ureka-eks-platform: 네임스페이스 앱 전용. Namespace dev·prod(이름으로 제한)·ResourceQuota·LimitRange·Role·RoleBinding만.
  Argo CD는 클러스터 범위 자원에 목적지(destinations) 검사를 하지 않는다. 그래서 Namespace는 허용 목록의 name으로 dev·prod만 연다
  (argocd·kube-system 등 다른 네임스페이스의 라벨을 바꾸는 변경은 거부). 이미지 PR이 자주 드나드는 서비스 프로젝트와는 분리한다.
- ureka-eks-dev / ureka-eks-prod: 업무 앱 전용. 목적지는 자기 네임스페이스 하나. 클러스터 범위 자원·Secret·RBAC는 없다.
  Secret은 ESO(#63, default 프로젝트의 비밀 연결 앱)만 만든다. Ingress(#64)는 해당 변경에서 허용 목록에 더한다. NetworkPolicy(#49)는 아래에 허용한다.
root 앱보다 먼저(wave -3) 만든다. 저장소는 이 저장소 하나만.
*/ -}}
{{- $repo := .Values.repoURL }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ureka-eks-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: EKS dev·prod 네임스페이스·Quota·LimitRange·prod 사람 권한(#62)
  sourceRepos:
    - {{ $repo }}
  destinations:
    {{- range .Values.environments }}
    - server: https://kubernetes.default.svc
      namespace: {{ include "eksapps.envName" . }}
    {{- end }}
  # name: Argo CD 3.6 ClusterResourceRestrictionItem.Name. 비우면 모든 이름이 허용되므로 환경마다 정확한 이름을 적는다.
  clusterResourceWhitelist:
    {{- range .Values.environments }}
    - group: ""
      kind: Namespace
      name: {{ include "eksapps.envName" . }}
    {{- end }}
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
{{- range .Values.environments }}
{{- $env := include "eksapps.envName" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ureka-eks-{{ $env }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: EKS {{ $env }} 업무 앱(데이터 계층·서비스)
  sourceRepos:
    - {{ $repo }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ $env }}
  # 클러스터 범위 자원은 하나도 만들 수 없다.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    # chat 마이그레이션 Job(PreSync 훅)
    - group: batch
      kind: Job
    # auth 카나리(Argo Rollouts, argocd/eks/argo-rollouts-app.yaml)
    - group: argoproj.io
      kind: Rollout
  # Git에 없는 자원이 이 네임스페이스에 생기면 Argo CD 화면에 경고로 보인다(사람이 직접 만든 자원 찾기).
  # ESO가 만든 Secret·ReplicaSet·Pod처럼 소유자가 있는 자원은 경고에서 빠진다.
  orphanedResources:
    warn: true
  {{- if eq $env "prod" }}
  # prod auth 카나리 승격·중단(#62에서 넘김). Kubernetes Rollout patch 대신 Argo CD의 Rollout 동작만 연다:
  # 이미지·Pod 템플릿을 바꾸는 sync·update·delete·로그는 없다. 대상은 ureka-auth-eks-prod 하나.
  # groups가 비어 있어 지금은 아무에게도 붙지 않는다(Argo CD 계정은 admin 하나, 그동안 승격·중단은 관리자가 한다).
  # 사람별 계정(SSO 등)이 생기면 플랫폼 담당 그룹을 여기에 넣는 PR을 한다.
  roles:
    - name: auth-rollout-operator
      description: prod auth Rollout 승격·중단·재시도만
      policies:
        - p, proj:ureka-eks-prod:auth-rollout-operator, applications, get, ureka-eks-prod/ureka-auth-eks-prod, allow
        {{- range list "resume" "promote-full" "abort" "retry" }}
        - p, proj:ureka-eks-prod:auth-rollout-operator, applications, action/argoproj.io/Rollout/{{ . }}, ureka-eks-prod/ureka-auth-eks-prod, allow
        {{- end }}
      groups: []
  {{- end }}
{{- end }}
