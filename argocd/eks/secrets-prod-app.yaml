# EKS prod 비밀 연결(gitops#63): 리더 서비스계정·SecretStore·ExternalSecret·리더 보호 정책.
# 직접 kubectl apply 하지 않는다: scripts/eks/register_secrets_app.py가 승인 계정 ID를 helm 파라미터 awsAccountId로 넣어 등록한다.
# 계정 ID는 이 PUBLIC 저장소에 쓰지 않는다(Git에는 빈칸, 비면 렌더링이 실패한다).
# 이 Application 자체는 Git에서 동기화되지 않으므로 주입한 값이 지워지지 않는다. 다시 넣으려면 등록 도구를 다시 실행한다.
# 선행: external-secrets 앱 Healthy, prod 네임스페이스(#62), Secrets Manager에 ureka/eks/prod/… 원본(docs/eks-secrets.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-eks-secrets-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kdt-ureka/ureka-gitops.git
    targetRevision: main
    path: charts/ureka-eks-secrets
    helm:
      releaseName: ureka-eks-secrets-prod
      valueFiles: [../../environments/eks/prod/secrets.yaml]
      parameters:
        - name: awsAccountId
          value: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Git과 다르게 바뀐 연결은 되돌린다. prune은 끈다: ExternalSecret이 지워지면 소유한 Secret도 지워져 앱이 내려간다.
    # 묶음·Secret을 없애는 변경은 PR 병합 뒤 CN이 Argo CD에서 해당 자원만 확인하고 지운다.
    automated:
      prune: false
      selfHeal: true
    # 네임스페이스는 #62가 만든다(Pod Security·quota 라벨). 여기서 만들지 않는다.
