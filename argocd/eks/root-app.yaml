# EKS root 앱(app-of-apps, #43). 이것 하나만 클러스터에 등록하면 argocd/eks/apps가 AppProject 3개와 dev·prod 앱을 만든다.
# 직접 kubectl apply 하지 않는다: scripts/eks/register_root_app.py가 승인 계정의 ECR 주소를 helm 파라미터 ecrRegistry로 넣어 등록한다.
# ECR 주소에는 계정 ID가 있어 이 PUBLIC 저장소에 쓰지 않는다(Git에는 빈칸, 비면 apps 렌더링이 실패한다).
# 이 Application 자체는 Git에서 동기화되지 않으므로(등록 도구가 등록) 주입한 값이 Argo CD에 지워지지 않는다. 다시 넣으려면 등록 도구를 다시 실행한다.
# root는 default 프로젝트다(AppProject·Application을 argocd 네임스페이스에 만들어야 한다). 업무 앱은 아래 프로젝트로 제한된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-eks-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kdt-ureka/ureka-gitops.git
    targetRevision: main
    path: argocd/eks/apps
    helm:
      releaseName: ureka-eks-root
      parameters:
        - name: ecrRegistry
          value: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # root는 dev·prod 모두 자동이다. Application 정의(어느 경로·values를 볼지)만 맞춘다.
    # prod 앱은 automated가 없어, root가 동기화돼도 prod 자원은 사람이 Sync하기 전까지 바뀌지 않는다.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
