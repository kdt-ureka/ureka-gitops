# External Secrets Operator 설치(gitops#63). root 앱에는 넣지 않는다. CN이 EKS에서 손으로 한 번 등록·Sync한다.
#   kubectl --context ureka-eks apply -f argocd/eks/external-secrets-app.yaml
# 자동 목록에 두지 않는 이유: 이 앱이 실수로 지워지면 CRD와 함께 모든 ExternalSecret·Secret 연결이 사라진다(Rollouts와 같은 방식).
# 차트 버전은 고정한다. ESO는 최신 릴리스만 지원하므로(2.15 = Kubernetes 1.37) 올릴 때 이 줄을 바꾸는 PR로 한다.
# 컨트롤러 서비스계정에는 AWS 역할을 주지 않는다. 환경별 SecretStore가 그 네임스페이스 리더 계정으로 IRSA를 쓴다
# (charts/ureka-eks-secrets, infra/environments/eks/secrets.tf). 클러스터 범위 저장소·PushSecret은 끈다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0 # 앱 v2.15.0, 차트 tgz sha256 ed94d41cc67e392ea45e370345eb491b0fdc21387f1aaaefcf8e2e6c85089e1d (11/22 확인)
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        # ClusterSecretStore가 있으면 어느 네임스페이스의 ExternalSecret이든 dev/prod 리더를 빌려 쓸 수 있다.
        # 네임스페이스 SecretStore만 처리하고, 클러스터 범위 CRD는 만들지도 않는다.
        crds:
          createClusterExternalSecret: false
          createClusterSecretStore: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
        processClusterExternalSecret: false
        processClusterStore: false
        processClusterGenerator: false
        processClusterPushSecret: false
        # 비밀을 Secrets Manager로 되쓰는 기능은 쓰지 않는다(리더 역할에도 쓰기 권한 없음).
        processPushSecret: false
        rbac:
          # 기본값은 ClusterRole로 클러스터의 모든 서비스계정 토큰을 발급할 수 있다. 끄고,
          # 환경마다 ureka-secrets-reader 하나만 허용하는 Role·RoleBinding을 charts/ureka-eks-secrets가 만든다.
          serviceAccountTokenCreate: false
          # 기본 edit·admin 역할에 ExternalSecret·SecretStore 쓰기가 합쳐지지 않게 한다(dev 편집자가 리더를 빌려 쓰는 저장소를 만들지 못하게).
          # 읽기(view)만 합친다. 비밀 연결 변경은 Git(Argo CD)으로만 한다.
          aggregateToEdit: false
          aggregateToAdmin: false
        # 차트 기본 서비스계정 이름(external-secrets)은 charts/ureka-eks-secrets의 esoControllerUser와 같아야 한다.
        serviceAccount:
          name: external-secrets
        replicaCount: 1
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
        webhook:
          replicaCount: 1
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
        certController:
          replicaCount: 1
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # CRD가 커서 client-side apply의 annotation 크기 제한에 걸리지 않게 한다.
      - ServerSideApply=true
  # 자동 sync·prune 없음. 지우면 모든 환경의 비밀 동기화가 멈춘다.
