# kind dev용 Argo CD Application: ureka-chat (api + worker + 마이그레이션 Job).
# 같은 이미지로 띄우는 api(release chat)와 worker(release chat-worker)를 sources 두 개로 한 Application에 묶는다.
# 한 Application이어야 api values의 PreSync 마이그레이션 Job(ureka-chat-migrate)이 api·worker 둘 다보다 먼저 돈다.
# (worker를 따로 두면 마이그레이션보다 먼저 떠서 스키마가 없어 재시작할 수 있다.)
# 마이그레이션이 실패하면 이번 동기화가 실패로 끝나고 api·worker Deployment는 이전 그대로 남는다. 바뀐 DB는 자동으로 되돌리지 않는다.
# 수동 동기화는 전체 sync로 한다. 리소스 일부만 고르는 선택 sync는 PreSync 훅을 건너뛴다.
# DB·계정(ureka-dev-data-kind)과 Secret(scripts/kind/create-secrets.sh)이 있어야 한다. AI는 선택(create-secrets.sh --chat-ai).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-chat-kind
  namespace: argocd
spec:
  project: default
  sources:
    # api + 마이그레이션 Job
    - repoURL: https://github.com/kdt-ureka/ureka-gitops.git
      targetRevision: main
      path: charts/ureka-backend
      helm:
        releaseName: chat
        valueFiles:
          - ../../environments/kind/ureka-chat.yaml
    # worker (Service·마이그레이션 없음)
    - repoURL: https://github.com/kdt-ureka/ureka-gitops.git
      targetRevision: main
      path: charts/ureka-backend
      helm:
        releaseName: chat-worker
        valueFiles:
          - ../../environments/kind/ureka-chat-worker.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # 재시도하면 마이그레이션 Job도 새로 만들어 다시 돈다(Alembic upgrade head는 다시 실행해도 안전하다).
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
