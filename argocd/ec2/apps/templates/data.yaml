# 데이터 계층(PostgreSQL+pgvector, Redis, Mailpit, DB 계정 Job). 서비스보다 먼저(wave -1).
# Secret은 Git에 없다. scripts/ec2/up.sh가 root 앱보다 먼저 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ureka-dev-data-{{ .Values.suffix }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: environments/{{ .Values.valuesDir }}/data
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  {{- include "ec2apps.syncPolicy" . | nindent 2 }}
