# Argo Rollouts 설치 (gitops#47). root 앱(argocd/ec2/apps)에는 넣지 않는다. CN이 EC2에서 손으로 한 번 등록·Sync한다.
#   kubectl apply -f argocd/ec2/argo-rollouts-app.yaml
# 자동 목록에 두지 않는 이유: 이 앱이 실수로 지워지면 Rollouts와 함께 auth(Rollout)를 관리할 프로그램이 사라진다(docs#87 리뷰).
# auth를 Rollout으로 바꾸는 값(environments/ec2/dev/ureka-auth.yaml)보다 먼저 설치돼 있어야 한다. 없으면 kind: Rollout을 만들지 못해 auth가 내려간다.
# 차트 버전은 고정한다. 올릴 때는 이 줄을 바꾸는 PR로 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.12 # 앱 v1.10.2
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          # EC2 한 대라 1개로 둔다. EKS에서 다시 정한다.
          replicas: 1
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
        # 화면은 Argo CD의 Rollout 동작(resume·abort·retry)으로 대신한다.
        dashboard:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Rollout·AnalysisTemplate CRD가 커서 client-side apply의 annotation 크기 제한에 걸리지 않게 한다.
      - ServerSideApply=true
  # 자동 sync·prune 없음. Rollouts는 계속 쓰는 도구라 지우지 않는다(docs 06-카나리-작업계획 1-6).
