name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # AWS 자격 없이 형식·문법·정책 테스트(mock provider)만 한다. plan·apply는 사람이 로컬에서 한다.
    name: Terraform fmt, validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/environments/shared
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.15.0'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Init without backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Test policies with mock provider
        run: terraform test
