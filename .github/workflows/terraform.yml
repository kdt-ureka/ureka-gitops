name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/eks/**'
      - 'tests/eks/**'
      - 'scripts/ec2/copy_eks_dev_secrets.py'
      - 'charts/ureka-eks-secrets/values.yaml'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/eks/**'
      - 'tests/eks/**'
      - 'scripts/ec2/copy_eks_dev_secrets.py'
      - 'charts/ureka-eks-secrets/values.yaml'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  operator-tests:
    name: EKS operator safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test without AWS credentials
        run: python3 -m unittest discover -s tests/eks -v
  check:
    # AWS 자격 없이 형식·문법·정책 테스트(mock provider)만 한다. plan·apply는 사람이 로컬에서 한다.
    # 폴더(root·module)마다 따로 init·validate·test 한다. 새 폴더를 만들면 matrix에 추가한다.
    name: Terraform check (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra/environments/shared
          - infra/environments/network
          - infra/modules/network
          - infra/environments/ec2
          - infra/modules/k3s_host
          - infra/environments/eks
          - infra/environments/data
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.15.0'
          terraform_wrapper: false
      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Test policies with mock provider
        run: terraform test
