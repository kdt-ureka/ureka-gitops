name: Helm

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    # 클러스터 없이 chart가 각 환경 values로 렌더링되는지만 본다. 배포는 Argo CD가 한다.
    name: Lint and render charts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Lint and render each environment values file and data kustomization
        # Helm·kubectl(kustomize 내장)은 GitHub 호스트 러너 이미지에 기본 포함돼 있다.
        run: bash scripts/check-charts.sh
      - name: Chart optional fields render as intended
        # command/args, Service·포트 끄기, 헬스 체크 끄기·직접 지정, 마이그레이션 Job(PreSync)과 잘못된 조합 거부. yq는 러너 기본 포함.
        run: bash scripts/test-chart-options.sh
      - name: P11 runner refuses runs where SQL did not execute
        # 가짜 kubectl: 정상 흉내는 성공, 한 가지씩 바꾼 실패 14가지는 모두 실패여야 한다(클러스터 불필요).
        run: bash scripts/test-p11-check.sh
      - name: create-secrets.sh never overwrites and stops on non-NotFound errors
        # 가짜 kubectl로 Forbidden·연결 실패·일부 존재·볼륨만 남음에서 Secret을 하나도 만들지 않는지, chat·ops 추가 경로가 auth 값을 복사하는지 본다.
        run: bash scripts/test-create-secrets.sh
      - name: db-bootstrap SQL runs as superuser (kind) and as an RDS-like non-superuser
        # 실제 PostgreSQL 18(pgvector 이미지)을 Docker로 띄워 두 번씩 실행하고 최종 상태(계정·DB 소유자·접속 권한)를 비교한다.
        run: bash scripts/test-db-bootstrap-sql.sh
      - name: rds-bootstrap.sh never leaves the master Secret behind
        # 가짜 kubectl·aws로 성공·Job 실패·시간 초과·Secret 삭제 실패·aws 실패·동시 실행을 돌려 정리와 무노출을 본다.
        run: bash scripts/test-rds-bootstrap.sh
      - name: db-bootstrap Job checks the verifier before any DB call
        # 정상 verifier는 psql까지 가고, 줄바꿈·원문·잘못된 salt·키·반복 수는 DB 호출 0회로 실패해야 한다. sh = dash(러너 기본).
        run: bash scripts/test-run-bootstrap.sh
      - name: EC2 dev NetworkPolicy matches the allow table
        # 기본 거부 + 서비스별 허용(+ ingest·관측 정책 합집합)을 계산해 tests/networkpolicy/expected.json과 모든 조합이 같은지 본다. python3 표준 라이브러리·yq.
        run: bash scripts/test-dev-networkpolicy.sh
      - name: EKS dev/prod namespaces fit quota and keep prod RBAC read-only
        # Pod Security 라벨(EC2 dev와 같음)·서비스 7개 카나리 최대치가 Quota 안·LimitRange·prod RBAC 최소 권한, 망가뜨린 입력은 실패. python3 표준 라이브러리·yq.
        run: bash scripts/test-eks-namespaces.sh
      - name: EKS secrets wiring matches app Secret names and stays per environment
        # charts/ureka-eks-secrets를 dev·prod로 렌더링해 앱이 읽는 모든 secretKeyRef를 만드는지, 원격 경로·리더 보호·ESO 설정을 본다(#63).
        run: bash scripts/test-eks-secrets.sh
      - name: EC2 ingest manual load script
        # 가짜 kubectl로 prepare·store(sha256 대조)·run sample/full 렌더링·격리 요약·임시 수신기(127.0.0.1, 경로 고정)를 본다.
        run: bash scripts/test-ec2-ingest.sh
      - name: EKS prod public entry exposes only reviewed paths and matches Terraform names
        # 공개 Ingress 5줄(recommend 없음)·잘못된 values 거부·컨트롤러 앱 값과 Terraform 이름(WAF·ALB group·IRSA) 대조.
        run: bash scripts/test-eks-public.sh

  observability:
    name: Observability manifests and rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install validation tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/obs-venv"
          "$RUNNER_TEMP/obs-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 \
            https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/prometheus.tar.gz"
          echo "68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/obs-venv/bin" >> "$GITHUB_PATH"
          echo "PROMTOOL=$RUNNER_TEMP/prometheus-3.16.0.linux-amd64/promtool" >> "$GITHUB_ENV"
      - name: Validate rendering, access boundaries, PromQL and alert transitions
        run: bash scripts/check-observability.sh
