name: Helm

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    # 클러스터 없이 chart가 각 환경 values로 렌더링되는지만 본다. 배포는 Argo CD가 한다.
    name: Lint and render charts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Lint and render each environment values file and data kustomization
        # Helm·kubectl(kustomize 내장)은 GitHub 호스트 러너 이미지에 기본 포함돼 있다.
        run: bash scripts/check-charts.sh
