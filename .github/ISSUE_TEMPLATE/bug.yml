name: 버그
description: 잘못 동작하는 것을 알립니다
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제목은 무엇이 잘못됐는지 쉬운 문장으로 씁니다. 예: "탈퇴 요청이 400으로 실패한다"
        등록한 뒤 오른쪽에서 담당자와 마일스톤을 고릅니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 생겼나
      description: 실제로 본 동작. 화면 캡처나 로그가 있으면 붙입니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 만드는 순서
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래 기대한 동작
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 로컬 도커 / 완전 로컬 / EC2 / EKS, 브랜치나 커밋
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: "- [ ] "
  - type: textarea
    id: related
    attributes:
      label: 관련
      description: 관련 이슈, PR, 문서
