name: 버그 신고
description: 잘못 동작하는 것을 알립니다
labels:
- bug
body:
- type: markdown
  attributes:
    value: |-
      제목은 무엇이 잘못됐는지 쉬운 문장으로 씁니다. 예: "chat /readyz가 503을 돌려준다"
      **이 레포는 공개(PUBLIC)입니다. 계정 ID, 주소, 키, 토큰, 사람 이름을 적지 않습니다.**
- type: textarea
  id: what
  attributes:
    label: 무슨 일이 생겼나
    description: 실제로 본 동작. 로그나 화면 캡처가 있으면 붙입니다. 비밀값·토큰은 지우고 붙입니다.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 다시 만드는 순서
    value: "1. \n2. "
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 원래 기대한 동작
  validations:
    required: true
- type: dropdown
  id: env
  attributes:
    label: 어디서 생겼나
    options:
    - 로컬 (compose·run.sh)
    - kind
    - EC2 (k3s)
    - EKS
  validations:
    required: true
- type: input
  id: svc
  attributes:
    label: 어느 서비스·자원인가
    placeholder: '예: ureka-chat Deployment, Argo CD 앱'
- type: input
  id: ver
  attributes:
    label: 브랜치나 커밋
    placeholder: '예: main 4d8ca37'
- type: textarea
  id: done
  attributes:
    label: 완료 조건
    description: 확인할 수 있는 결과를 체크박스로 적습니다. 실패해야 하는 경우의 시험도 넣습니다.
    value: |-
      - [ ] 같은 순서로 했을 때 기대한 동작이 나온다
      - [ ] 원인과 고친 내용을 남겼다
  validations:
    required: true
- type: textarea
  id: related
  attributes:
    label: 관련 작업
    description: 선행·후행 이슈, PR, 근거 문서. 다른 레포는 kdt-ureka/ureka-docs#12처럼 씁니다.
